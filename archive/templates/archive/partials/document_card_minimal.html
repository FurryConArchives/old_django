{% load static %}
<div class="document-card">
    <a href="{% url 'document_detail' document.slug %}" class="document-thumbnail">
        <img data-doc-thumb="1" data-original-src="{% url 'pdf_page_image' document.slug 1 %}" src="{% static 'archive/placeholder.jpg' %}" alt="{{ document.title }} - Page 1" loading="lazy">
        <div class="document-type-badge">
            {% if document.is_scanned %}Scanned File{% else %}Source File{% endif %}
        </div>
    </a>
    <div class="document-content">
        <h3 class="document-title">
            <a href="{% url 'document_detail' document.slug %}">{{ document.title }}</a>
        </h3>
        <div class="document-meta">
            {% if document.page_count %}
            <div class="meta-item"><i class="bi bi-file-earmark-text"></i><span>{{ document.page_count }} pages</span></div>
            {% endif %}
            <div class="meta-item"><i class="bi bi-eye"></i><span>{{ document.pdf_view_count|default:0 }} views</span></div>
        </div>
        <div class="document-actions">
            <a href="{% url 'document_detail' document.slug %}" class="btn btn-small"><i class="bi bi-eye"></i> View</a>
        </div>
    </div>
</div>
