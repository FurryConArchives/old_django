# Apex: HTML → old.*, JSON API → api.*
server {
    listen 80;
    listen 443 ssl http2;
    server_name furryconarchives.org www.furryconarchives.org;

    client_max_body_size 500M;

    ssl_certificate     /www/server/panel/vhost/cert/furryconarchives.org/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/furryconarchives.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/telegram-messages {
        return 308 https://old.furryconarchives.org$request_uri;
    }

    location ~ ^/api/v1(/.*)?$ {
        return 308 https://api.furryconarchives.org/v1$1$is_args$args;
    }

    location /v1/ {
        return 308 https://api.furryconarchives.org$request_uri;
    }

    location = /v1 {
        return 308 https://api.furryconarchives.org/v1/;
    }

    location / {
        return 308 https://old.furryconarchives.org$request_uri;
    }

    access_log /www/wwwlogs/furryconarchives.org.log;
    error_log /www/wwwlogs/furryconarchives.org.error.log;
}

# Legacy HTML frontend (relocated from furryconarchives.org)
server {
    listen 80;
    listen 443 ssl http2;
    server_name old.furryconarchives.org;

    client_max_body_size 500M;

    ssl_certificate     /www/server/panel/vhost/cert/old.furryconarchives.org/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/old.furryconarchives.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /www/wwwroot/furryconarchives.org;
    index index.php index.html index.htm;

    location /static/ {
        alias /www/wwwroot/furryconarchives.org/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /www/wwwroot/furryconarchives.org/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        alias /www/wwwroot/furryconarchives.org/staticfiles/favicon.ico;
        log_not_found off;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;

        # CORS for tg.tabs.gay
        set $cors_origin "";
        if ($http_origin ~* (https?://tg\.tabs\.gay)$) {
            set $cors_origin $http_origin;
        }

        if ($cors_origin ~* .) {
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    access_log /www/wwwlogs/old.furryconarchives.org.log;
    error_log /www/wwwlogs/old.furryconarchives.org.error.log;
}

